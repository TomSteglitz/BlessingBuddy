<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2b2f6b"/>
      <stop offset="0.55" stop-color="#151840"/>
      <stop offset="1" stop-color="#07081a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f5b942" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c88a1e"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a8c"/>
      <stop offset="1" stop-color="#141b4d"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ff9c"/>
      <stop offset="1" stop-color="#2fbf4a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- rays -->
    <g transform="translate(256 250)" fill="#ffd36b" opacity="0.18">
      <g id="ray"><polygon points="-10,0 10,0 0,-300"/></g>
      <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)"/>
    </g>

    <circle cx="256" cy="250" r="200" fill="url(#glow)"/>
    <circle cx="256" cy="250" r="168" fill="none" stroke="#f5c95a" stroke-width="5" opacity="0.55"/>
    <circle cx="256" cy="250" r="182" fill="none" stroke="#f5c95a" stroke-width="2" opacity="0.3"/>

    <!-- shield -->
    <path d="M256 92 L380 136 Q384 290 256 410 Q128 290 132 136 Z" fill="#000" opacity="0.45" filter="url(#soft)" transform="translate(0 10)"/>
    <path d="M256 92 L380 136 Q384 290 256 410 Q128 290 132 136 Z" fill="url(#shield)"/>
    <path d="M256 116 L358 152 Q360 280 256 380 Q152 280 154 152 Z" fill="url(#shieldInner)"/>

    <!-- plus with glow -->
    <g transform="translate(256 240)">
      <path d="M-22 -78 H22 V-22 H78 V22 H22 V78 H-22 V22 H-78 V-22 H-22 Z" fill="#7dff8a" opacity="0.7" filter="url(#soft)"/>
      <path d="M-22 -78 H22 V-22 H78 V22 H22 V78 H-22 V22 H-78 V-22 H-22 Z" fill="url(#plus)" stroke="#eaffdf" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- sparkles -->
    <g fill="#fff4c2">
      <path d="M398 92 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z"/>
      <path d="M110 360 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity="0.85"/>
      <path d="M420 330 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity="0.7"/>
    </g>
  </g>
</svg>
